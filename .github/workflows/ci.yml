name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: check, build, link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Must run before `npm run build` — the build step regenerates
      # config.yml automatically, which would make this check trivially
      # pass regardless of what was actually committed. Checking the
      # as-committed file first is the whole point: it catches a PR that
      # changed the schema/template and forgot to regenerate before
      # committing, or hand-edited config.yml directly.
      - name: Check CMS config matches the schema
        run: npm run check:cms-config

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links
