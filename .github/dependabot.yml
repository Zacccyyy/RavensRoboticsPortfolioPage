# Weekly npm dependency updates, grouped into a single PR rather than one
# PR per package — this repo has ~15 direct dependencies plus transitives;
# one-PR-per-bump would be more noise than signal for a solo-maintained
# public repo. `npm audit --audit-level=high` in .github/workflows/ci.yml
# still runs on every PR (including these), so a grouped update that
# introduces a real high/severity advisory fails CI rather than merging
# quietly.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
    # typescript 7.x isn't a version bump this repo can take yet:
    # @astrojs/check@0.9.10 declares a peer dependency of
    # typescript@"^5.0.0 || ^6.0.0", so npm ci fails outright (ERESOLVE)
    # the moment typescript crosses into 7.x — confirmed by a real
    # Dependabot PR (#1, closed) whose CI run hit exactly this. This isn't
    # a version we can pin around or force; it's @astrojs/check not
    # supporting TS 7 yet. Remove this once @astrojs/check widens its
    # peer range.
    ignore:
      - dependency-name: 'typescript'
        versions: ['7.x']
