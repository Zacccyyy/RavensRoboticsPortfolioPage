# GENERATED FILE — do not hand-edit.
# Produced by scripts/generate-cms-config.mjs from src/project-schema.ts
# (via scripts/cms-config-template.mjs). Re-run that script after changing
# the schema or the template — `npm run build` already does this for you.
# scripts/check-cms-config.mjs (run in CI) fails if this file is out of
# date with either one.

backend:
  name: github
  repo: Zacccyyy/RavensRoboticsPortfolioPage
  branch: main
  publish_mode: simple
media_folder: ""
public_folder: ""
output:
  omit_empty_optional_fields: true
collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    path: "{{fields.slug}}/index"
    extension: mdx
    format: frontmatter
    frontmatter_delimiter: ---
    create: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Slug
        widget: string
        pattern:
          - ^[a-z0-9]+(-[a-z0-9]+)*$
          - Lowercase letters, numbers, and hyphens only — this becomes the folder name and the URL.
      - name: tagline
        label: Tagline
        widget: string
        hint: One sentence.
      - name: summary
        label: Summary
        widget: text
        pattern:
          - ^.{1,200}$
          - Keep it to 200 characters or fewer — this is the meta description and OG/Twitter card text.
      - name: date
        label: Date of Origin
        widget: datetime
        format: YYYY-MM-DD
        date_format: true
        time_format: false
      - name: status
        label: Status
        widget: select
        options:
          - shipped
          - in-progress
          - concept
          - archived
      - name: category
        label: Category
        widget: select
        options:
          - software
          - hardware
          - robotics
          - build
      - name: featured
        label: Featured
        widget: boolean
        default: false
        required: false
      - name: cardSize
        label: Card Size
        widget: select
        options:
          - sm
          - md
          - lg
        default: md
        required: false
      - name: tags
        label: Tags
        widget: list
        required: false
        max: 6
        default: []
      - name: accent
        label: Accent Colour
        widget: color
        required: false
        enableAlpha: false
        hint: "Optional per-project accent, e.g. #4FD97A. No UI for this in the old studio editor."
      - name: cover
        label: Cover Image
        widget: image
        required: false
        hint: Omit for a text-forward card instead of an image card (see PID CONTROLLER).
      - name: gallery
        label: Gallery
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - name: src
            label: Image
            widget: image
            media_folder: gallery
            public_folder: ./gallery
          - name: alt
            label: Alt Text
            widget: string
            hint: Describe this specific photo — it's the lightbox caption, not the project tagline repeated.
      - name: preview
        label: Preview Loop (homepage hover video)
        widget: object
        required: false
        fields:
          - name: src
            label: Video File
            widget: file
            media_folder: /public/videos/{{fields.slug}}
            public_folder: /videos/{{fields.slug}}
            hint: Silent loop, ideally under 500KB — it autoplays on hover on the homepage for every visitor.
          - name: poster
            label: Poster Image
            widget: image
      - name: videos
        label: Videos
        widget: list
        required: false
        typeKey: provider
        summary: "{{fields.title}} ({{fields.provider}})"
        types:
          - name: youtube
            label: YouTube
            fields:
              - name: id
                label: Video ID
                widget: string
                hint: The part after ?v= in the YouTube URL.
              - name: title
                label: Title
                widget: string
          - name: vimeo
            label: Vimeo
            fields:
              - name: id
                label: Video ID
                widget: string
              - name: title
                label: Title
                widget: string
          - name: local
            label: Local File
            fields:
              - name: src
                label: Video File
                widget: file
                media_folder: /public/videos/{{fields.slug}}
                public_folder: /videos/{{fields.slug}}
                hint: Keep under ~5MB — see CONTENT.md's media policy.
              - name: poster
                label: Poster Image
                widget: image
              - name: title
                label: Title
                widget: string
              - name: duration
                label: Duration
                widget: string
                pattern:
                  - ^[0-9]+:[0-9]{2}$
                  - Use m:ss format, e.g. 2:14 — authored, not measured from the file.
              - name: caption
                label: Caption
                widget: string
                required: false
      - name: links
        label: Links
        widget: object
        required: false
        fields:
          - name: github
            label: GitHub
            widget: string
            required: false
          - name: demo
            label: Live Demo
            widget: string
            required: false
          - name: docs
            label: Docs
            widget: string
            required: false
      - name: downloads
        label: Downloads
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - name: label
            label: Label
            widget: string
          - name: url
            label: URL
            widget: string
            hint: Absolute /downloads/... path for small text files, or a GitHub Release asset URL for anything large — see CONTENT.md.
          - name: size
            label: File Size
            widget: string
            hint: Authored, e.g. "12.4 MB" — not measured automatically.
      - name: body
        label: Body
        widget: markdown
        hint: Saved as the file's Markdown/MDX body, below the frontmatter — not a frontmatter field itself.
